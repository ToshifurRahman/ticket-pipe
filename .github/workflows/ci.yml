name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ticket_pipe
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - '5433:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d ticket_pipe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      localstack:
        image: localstack/localstack:3.8
        env:
          SERVICES: sqs,sns
        ports:
          - '4566:4566'
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - '1025:1025'
          - '8025:8025'
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create the test environment
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5433/ticket_pipe
          REDIS_URL=redis://localhost:6379
          SQS_ENDPOINT=http://localhost:4566
          SNS_ENDPOINT=http://localhost:4566
          SQS_QUEUE_NAME=ticket-processing-ci
          SQS_DLQ_NAME=ticket-processing-ci-dlq
          AWS_REGION=us-east-1
          AWS_ACCESS_KEY_ID=test
          AWS_SECRET_ACCESS_KEY=test
          PORTKEY_API_KEY=placeholder
          GOOGLE_API_KEY=placeholder
          PRIMARY_GATEWAY=google
          PRIMARY_MODEL=placeholder
          OPS_TOKEN=local-ci-ops-token-0000000000000000
          MAIL_FROM=noreply@example.com
          TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
          EOF
      - name: Wait for Mailpit
        run: |
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:8025/readyz && exit 0
            sleep 1
          done
          exit 1
      - name: Check the CI test split
        run: bun scripts/ci-test-list.ts
      - name: Migrate
        run: bun --filter @relay/api migrate
      - name: Create queues and topics
        run: bun --filter @relay/api setup
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint --concurrency=off
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: env NODE_ENV=test bun --filter @relay/api test:unit --exclude tests/guards/format.test.ts
      - name: Integration tests
        run: env NODE_ENV=test bun --filter @relay/api test:integration --exclude tests/integration/repositories/ai-interactions.test.ts
      - name: Serial tests
        working-directory: apps/api
        run: env NODE_ENV=test node ../../node_modules/vitest/vitest.mjs run tests/guards/format.test.ts tests/integration/repositories/ai-interactions.test.ts --no-file-parallelism --maxWorkers=1
      - name: Web tests
        run: env NODE_ENV=test bun --filter @relay/web test

  build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the web app
        env:
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: bun --filter @relay/web build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and smoke-test the production image
        run: bun run test:image

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint the pull request's commits
        run: bunx --no-install commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"

  e2e:
    name: End-to-end
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ticket_pipe
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - '5433:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d ticket_pipe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      localstack:
        image: localstack/localstack:3.8
        env:
          SERVICES: sqs,sns
        ports:
          - '4566:4566'
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - '1025:1025'
          - '8025:8025'
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create the test environment
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5433/ticket_pipe
          REDIS_URL=redis://localhost:6379
          SQS_ENDPOINT=http://localhost:4566
          SNS_ENDPOINT=http://localhost:4566
          SQS_QUEUE_NAME=ticket-processing-ci
          SQS_DLQ_NAME=ticket-processing-ci-dlq
          AWS_REGION=us-east-1
          AWS_ACCESS_KEY_ID=test
          AWS_SECRET_ACCESS_KEY=test
          PORTKEY_API_KEY=placeholder
          GOOGLE_API_KEY=placeholder
          PRIMARY_GATEWAY=google
          PRIMARY_MODEL=placeholder
          OPS_TOKEN=local-ci-ops-token-0000000000000000
          MAIL_FROM=noreply@example.com
          TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
          EOF
      - name: Wait for Mailpit
        run: |
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:8025/readyz && exit 0
            sleep 1
          done
          exit 1
      - name: Migrate
        run: bun --filter @relay/api migrate
      - name: Create queues and topics
        run: bun --filter @relay/api setup
      - name: Install the Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Run the end-to-end tests
        env:
          CI: '1'
        run: bunx playwright test --reporter=list,html
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
