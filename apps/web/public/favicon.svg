    <rect x="3.5" y="8" width="17" height="3.5" fill="#34C98B"/>
    <rect x="5" y="13" width="17" height="3.5" fill="#FF7A1A"/>
    <rect x="6.5" y="18" width="17" height="3.5" fill="#3FA766"/>
  </g>
</svg>
