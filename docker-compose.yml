services:
  postgres:
    image: postgres:16
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: ticket_pipe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ticket_pipe']
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3.8
    ports:
      - '4566:4566'
    environment:
      SERVICES: sqs,sns
      PERSISTENCE: '1'
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the queues and SNS topic once LocalStack is healthy (apps/api/scripts/setup-infra.ts is idempotent).
  setup:
    image: oven/bun:1.3.14
    working_dir: /app
    volumes:
      - .:/app
    environment:
      SQS_ENDPOINT: http://localstack:4566
      SNS_ENDPOINT: http://localstack:4566
    env_file:
      - path: .env
        required: false
    command: bun apps/api/scripts/setup-infra.ts
    depends_on:
      localstack:
        condition: service_healthy
    restart: on-failure

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  # Catches customer email locally (story 6.9): SMTP on 1025, inbox UI and API on 8025.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - '1025:1025'
      - '8025:8025'

  # ElasticMQ is a local SQS implementation for verifying the endpoint switch (story 7.8).
  # Profile only, so the existing `compose up` services are never recreated by adding it.
  # It has no SNS, which is why setup runs with SNS_ENDPOINT empty against it.
  elasticmq:
    profiles: [elasticmq]
    image: softwaremill/elasticmq-native:1.6.11
    ports:
      - '9324:9324'

  # Redis for the `image` profile only: no published port, so it never clashes with a Redis already
  # on the host's 6379 and never shares rate limits or socket rooms with the dev Redis.
  redis-image:
    profiles: [image]
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # The production image, run against this stack (story 7.2): `docker compose --profile image up`.
  # Own database and queues, so the dev data is untouched. Driven by `bun run test:image`.
  app:
    profiles: [image]
    image: ticket-pipe-app:local
    build:
      context: .
      network: ${IMAGE_BUILD_NETWORK:-default}
      args:
        VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    environment:
      NODE_ENV: production
      PORT: '8080'
      OPS_TOKEN: image-smoke-ops-token-0123456789abcdef
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ticket_pipe_image
      REDIS_URL: redis://redis-image:6379
      SQS_ENDPOINT: http://localstack:4566
      SNS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_NAME: ticket-processing-image
      SQS_DLQ_NAME: ticket-processing-image-dlq
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PORTKEY_API_KEY: image-smoke-placeholder
      GOOGLE_API_KEY: image-smoke-placeholder
      PRIMARY_GATEWAY: google
      PRIMARY_MODEL: placeholder
      # Cloudflare's always-pass test secret: this profile never sees real traffic.
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
    ports:
      - '3200:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis-image:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  localstack-data:
